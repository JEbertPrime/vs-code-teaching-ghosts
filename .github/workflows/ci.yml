name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this ref to the VS Code Marketplace
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20.x

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        if: runner.os == 'Linux'
        run: npm audit --audit-level=moderate

      - name: Run extension tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Run extension tests
        if: runner.os != 'Linux'
        run: npm test

  package:
    name: Package VSIX
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package extension
        run: npm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: teaching-ghosts-vsix
          path: "*.vsix"
          if-no-files-found: error

  publish:
    name: Publish to VS Code Marketplace
    needs:
      - validate
      - package
    runs-on: ubuntu-latest
    environment: visual-studio-marketplace
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Marketplace token
        run: node -e "if (!process.env.VSCE_PAT) { console.error('Set the VSCE_PAT repository secret before publishing.'); process.exit(1); }"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish extension
        run: npm run deploy
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSCE_PUBLISHER: ${{ vars.VSCE_PUBLISHER }}
